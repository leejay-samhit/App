apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.slangcart.truecaller'
version = '1.0.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.slangcart.truecaller"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  // Pinned on purpose: the Truecaller setup page still shows 3.2.0 samples,
  // and a dynamic version would change behaviour between builds.
  implementation "com.truecaller.android.sdk:truecaller-sdk:3.3.0"
  implementation "androidx.fragment:fragment-ktx:1.8.5"
}
